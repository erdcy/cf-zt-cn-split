name: 每日同步 CN Split Tunnels 到 Cloudflare Zero Trust
permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日北京时间11:00（UTC 3:00）
  workflow_dispatch:         # 手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 升级 checkout 组件到最新的 v4 稳定版或 v5（修复 Node 24 兼容性）
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .

      # 2. 升级设置 Python 组件到最新版
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          update-environment: true

      - name: 安装依赖
        run: pip install requests

      - name: 运行同步脚本
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROFILE_ID: ${{ secrets.CF_PROFILE_ID }}
          MODE: exclude                     # 可改成 include
        run: python cf-zt-cn-split.py
