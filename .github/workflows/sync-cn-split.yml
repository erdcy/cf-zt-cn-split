name: 每日同步 CN Split Tunnels 到 Cloudflare Zero Trust
permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日北京时间11:00（UTC 3:00）
  workflow_dispatch:         # 手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 将原先的 v4 修改为官方最新支持 Node 24+ 的 v4.2.2（或直接用 v4 最新小版本，GitHub 会自动对齐内部运行时）
      - uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: 准备运行环境并执行同步
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROFILE_ID: ${{ secrets.CF_PROFILE_ID }}
          MODE: exclude
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests
          python3 cf-zt-cn-split.py
