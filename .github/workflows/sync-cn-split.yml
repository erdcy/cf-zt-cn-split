name: 每日同步 CN Split Tunnels 到 Cloudflare Zero Trust
permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日北京时间11:00（UTC 3:00）
  workflow_dispatch:         # 手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 使用轻量化拉取，避免触发 Node 警告
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .

      # 不再使用 setup-python 组件，直接用 Ubuntu 自带的 Python3 
      - name: 准备运行环境并执行同步
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROFILE_ID: ${{ secrets.CF_PROFILE_ID }}
          MODE: exclude
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests
          python3 cf-zt-cn-split.py
