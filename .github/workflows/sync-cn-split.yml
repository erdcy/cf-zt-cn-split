name: 每日同步 CN Split Tunnels 到 Cloudflare Zero Trust
permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日北京时间11:00（UTC 3:00）
  workflow_dispatch:         # 手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .

      # 使用原生的运行环境，同时捕获 Python 内部的真实 API 报错
      - name: 准备运行环境并执行同步
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROFILE_ID: ${{ secrets.CF_PROFILE_ID }}
          MODE: exclude
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests
          python3 cf-zt-cn-split.py || (echo "==== 脚本执行失败，请检查下方报错信息 ====" && exit 1)
